name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy, rustfmt
          toolchain: 1.88.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          coverage: none
          php-version: '8.4'
          tools: composer

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked

      - name: Validate Composer package
        run: composer validate --strict --no-check-publish

      - name: Validate PHP stub
        run: php -l stubs/anydoc.stub.php

  extension:
    name: ${{ matrix.os }} / PHP ${{ matrix.php }} / ${{ matrix.ts }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            php: '8.4'
            ts: nts
          - os: ubuntu-22.04
            php: '8.4'
            ts: zts
          - os: ubuntu-22.04
            php: '8.5'
            ts: nts
            oracle: true
          - os: ubuntu-22.04
            php: '8.5'
            ts: zts
          - os: macos-15-intel
            php: '8.4'
            ts: nts
          - os: macos-15-intel
            php: '8.5'
            ts: nts

    steps:
      - name: Checkout PHP extension
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout Anydoc v0.1.7 fixtures
        if: matrix.oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: _upstream
          persist-credentials: false
          ref: v0.1.7
          repository: firecrawl/anydoc

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          coverage: none
          php-version: ${{ matrix.php }}
        env:
          phpts: ${{ matrix.ts }}

      - name: Select Clang 15
        if: runner.os == 'Linux'
        run: |
          echo "CLANG_PATH=/usr/bin/clang-15" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-15/lib" >> "$GITHUB_ENV"

      - name: Configure extension
        working-directory: pie
        run: |
          phpize
          ./configure --with-php-config="$(command -v php-config)" --enable-anydoc

      - name: Build extension
        working-directory: pie
        run: make -j2

      - name: Run PHPT tests
        working-directory: pie
        run: make test
        env:
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1

      - name: Run Markdown and detection parity
        if: matrix.oracle
        run: >-
          php -n -d extension="$PWD/pie/modules/anydoc.so"
          tests/parity/upstream.php _upstream

      - name: Set up Python oracle
        if: matrix.oracle
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install official Python binding
        if: matrix.oracle
        run: python -m pip install ./_upstream/python

      - name: Generate official model oracle
        if: matrix.oracle
        run: python tests/parity/oracle.py _upstream /tmp/anydoc-model-oracle.json

      - name: Run document model parity
        if: matrix.oracle
        run: >-
          php -n -d extension="$PWD/pie/modules/anydoc.so"
          tests/parity/model.php _upstream /tmp/anydoc-model-oracle.json

      - name: Package Unix binary
        if: github.ref_type == 'tag'
        id: package
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: bash .github/scripts/package-unix.sh "${PACKAGE_VERSION}"

      - name: Upload Unix package
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: php-anydoc-${{ matrix.os }}-${{ matrix.php }}-${{ matrix.ts }}
          path: ${{ steps.package.outputs.archive }}

  pie:
    name: PIE package build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          coverage: none
          php-version: '8.5'
          tools: pie:1.4.9

      - name: Register local package
        run: >-
          pie repository:add path "$PWD"
          --with-php-config="$(command -v php-config)"
          --with-phpize-path="$(command -v phpize)"
        env:
          PIE_WORKING_DIRECTORY: ${{ runner.temp }}/pie

      - name: Build package through PIE
        run: >-
          pie build "hosmelq/ext-anydoc:${PACKAGE_VERSION}"
          --with-php-config="$(command -v php-config)"
          --with-phpize-path="$(command -v phpize)"
          --no-interaction
        env:
          PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev-main' }}
          PIE_WORKING_DIRECTORY: ${{ runner.temp }}/pie

  windows:
    name: windows-latest / PHP ${{ matrix.php }} / ${{ matrix.ts }}

    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            ts: nts
          - php: '8.4'
            ts: ts
          - php: '8.5'
            ts: nts
          - php: '8.5'
            ts: ts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          coverage: none
          php-version: ${{ matrix.php }}
        env:
          phpts: ${{ matrix.ts }}

      - name: Build and test Windows package
        id: package
        shell: pwsh
        run: >-
          .github/scripts/windows.ps1
          -PackageVersion "$env:PACKAGE_VERSION"
        env:
          PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Upload Windows package
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: php-anydoc-${{ matrix.php }}-${{ matrix.ts }}
          path: ${{ steps.package.outputs.archive }}
